<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Video Download Companion 版本演进</title>
  <desc id="desc">从 0.1.10 可用版到 0.1.13 依赖更新测试版的关键变化。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <style>
      .t { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #e5e7eb; }
      .m { fill: #a5b4fc; }
      .card { fill: #1f2937; stroke: #4f46e5; stroke-width: 2; rx: 18; filter: url(#shadow2); }
    </style>
  </defs>
  <rect width="1200" height="500" rx="34" fill="url(#bg2)"/>
  <text x="600" y="68" text-anchor="middle" class="t" font-size="32" font-weight="700">从可用版到可维护版本</text>
  <line x1="135" y1="185" x2="1065" y2="185" stroke="#818cf8" stroke-width="5"/>

  <g transform="translate(55 115)">
    <circle cx="95" cy="70" r="13" fill="#c4b5fd"/>
    <rect x="0" y="110" width="230" height="220" class="card"/>
    <text x="115" y="153" text-anchor="middle" class="t" font-size="24" font-weight="700">0.1.10</text>
    <text x="115" y="185" text-anchor="middle" class="t m" font-size="17">三平台可用基线</text>
    <text x="24" y="225" class="t" font-size="16">• 持久队列与重试</text>
    <text x="24" y="257" class="t" font-size="16">• Cookie 回退</text>
    <text x="24" y="289" class="t" font-size="16">• 平台独立代理</text>
  </g>

  <g transform="translate(345 115)">
    <circle cx="95" cy="70" r="13" fill="#c4b5fd"/>
    <rect x="0" y="110" width="230" height="220" class="card"/>
    <text x="115" y="153" text-anchor="middle" class="t" font-size="24" font-weight="700">0.1.11</text>
    <text x="115" y="185" text-anchor="middle" class="t m" font-size="17">安装可靠性</text>
    <text x="24" y="225" class="t" font-size="16">• 动态读取 FFmpeg 摘要</text>
    <text x="24" y="257" class="t" font-size="16">• 严格校验下载来源</text>
    <text x="24" y="289" class="t" font-size="16">• 异常时安全中止</text>
  </g>

  <g transform="translate(635 115)">
    <circle cx="95" cy="70" r="13" fill="#c4b5fd"/>
    <rect x="0" y="110" width="230" height="220" class="card"/>
    <text x="115" y="153" text-anchor="middle" class="t" font-size="24" font-weight="700">0.1.12</text>
    <text x="115" y="185" text-anchor="middle" class="t m" font-size="17">结果操作</text>
    <text x="24" y="225" class="t" font-size="16">• 单击播放成品</text>
    <text x="24" y="257" class="t" font-size="16">• 资源管理器定位</text>
    <text x="24" y="289" class="t" font-size="16">• 仅允许已记录路径</text>
  </g>

  <g transform="translate(925 115)">
    <circle cx="95" cy="70" r="13" fill="#f0abfc"/>
    <rect x="0" y="110" width="230" height="220" class="card" style="stroke:#c026d3"/>
    <text x="115" y="153" text-anchor="middle" class="t" font-size="24" font-weight="700">0.1.13</text>
    <text x="115" y="185" text-anchor="middle" class="t m" font-size="17">测试版</text>
    <text x="24" y="225" class="t" font-size="16">• 依赖更新检查</text>
    <text x="24" y="257" class="t" font-size="16">• 事务替换与自检</text>
    <text x="24" y="289" class="t" font-size="16">• 自动恢复与手动回退</text>
  </g>
</svg>
