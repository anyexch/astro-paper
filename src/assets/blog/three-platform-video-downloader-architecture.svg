<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">三平台视频快捷下载器架构</title>
  <desc id="desc">Chrome 扩展提交规范化链接，由 Windows Companion 持久化任务并分流到 yt-dlp 或 DouK，最终保存到本地媒体目录。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .label { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #e2e8f0; }
      .muted { fill: #94a3b8; }
      .box { fill: #172033; stroke: #334155; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .accent { fill: #082f49; stroke: #38bdf8; }
      .line { stroke: #7dd3fc; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="680" rx="34" fill="url(#bg)"/>
  <text x="600" y="72" text-anchor="middle" class="label" font-size="34" font-weight="700">三平台视频快捷下载器</text>
  <text x="600" y="108" text-anchor="middle" class="label muted" font-size="18">浏览器只负责捕获；本机 Companion 负责持久化、调度、下载和恢复</text>

  <rect x="70" y="175" width="250" height="165" class="box"/>
  <text x="195" y="220" text-anchor="middle" class="label" font-size="25" font-weight="700">Chrome 扩展</text>
  <text x="195" y="258" text-anchor="middle" class="label muted" font-size="17">识别当前作品页面</text>
  <text x="195" y="288" text-anchor="middle" class="label muted" font-size="17">规范化平台、URL 与作品 ID</text>
  <text x="195" y="318" text-anchor="middle" class="label muted" font-size="17">快捷键提交并显示状态</text>

  <rect x="425" y="150" width="350" height="215" class="box accent"/>
  <text x="600" y="198" text-anchor="middle" class="label" font-size="27" font-weight="700">Windows Companion</text>
  <text x="600" y="236" text-anchor="middle" class="label muted" font-size="17">回环接口 + 随机令牌 + 来源校验</text>
  <text x="600" y="269" text-anchor="middle" class="label muted" font-size="17">SQLite 持久队列与重启恢复</text>
  <text x="600" y="302" text-anchor="middle" class="label muted" font-size="17">总并发 3 / yt-dlp 2 / DouK 1</text>
  <text x="600" y="335" text-anchor="middle" class="label muted" font-size="17">进度、重试、日志、更新与回退</text>

  <rect x="880" y="140" width="250" height="140" class="box"/>
  <text x="1005" y="185" text-anchor="middle" class="label" font-size="24" font-weight="700">yt-dlp + FFmpeg</text>
  <text x="1005" y="222" text-anchor="middle" class="label muted" font-size="17">YouTube / Bilibili</text>
  <text x="1005" y="251" text-anchor="middle" class="label muted" font-size="17">下载、合并、进度解析</text>

  <rect x="880" y="335" width="250" height="140" class="box"/>
  <text x="1005" y="380" text-anchor="middle" class="label" font-size="24" font-weight="700">DouK</text>
  <text x="1005" y="417" text-anchor="middle" class="label muted" font-size="17">Douyin 单作品适配</text>
  <text x="1005" y="446" text-anchor="middle" class="label muted" font-size="17">阶段识别与安全迁移</text>

  <rect x="380" y="505" width="440" height="115" class="box"/>
  <text x="600" y="550" text-anchor="middle" class="label" font-size="24" font-weight="700">本地媒体目录</text>
  <text x="600" y="586" text-anchor="middle" class="label muted" font-size="17">去重保存 · 默认播放器打开 · 资源管理器定位</text>

  <path d="M320 258 H425" class="line"/>
  <path d="M775 225 C820 225 830 210 880 210" class="line"/>
  <path d="M775 300 C830 300 830 405 880 405" class="line"/>
  <path d="M1005 280 V495 C1005 560 880 562 820 562" class="line"/>
  <path d="M1005 475 V495" class="line"/>
  <path d="M600 365 V505" class="line"/>
</svg>
